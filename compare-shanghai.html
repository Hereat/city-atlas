// S0 用 reference/preview.html 把新生成的包画出来与稿比对。别在这里改产品行为。

    water: '#DDE5DC', waterLine: '#CBD5C9', green: '#E2E9DD', rail: '#D3DAD0',

  // 蓝印：淡灰的地，密集支路织出街区的织理，主干与轨迹是那支亮蓝。
  { id: 'azure', name: '蓝印',
    paper: '#DCDBD6', block: '#DCDBD6',
    road: '#98A4C8', roadTiers: ['#7C8BB8', '#8B99C2', '#9BA7CB', '#A9B3D3'],
    roadW: [18, 9, 4.5, 2], minPx: [1.6, 1.1, .75, .5], roadFade: [1, .92, .8, .62],
    water: '#E9E9E5', waterLine: '#E9E9E5', green: '#CBD0CE', rail: '#98A4C8',

  { id: 'plate', name: '图版',

];

// ---------- 数据解码：增量整数 → 米制坐标 ----------
function decode(arr) {
  const out = new Float32Array(arr.length);
  let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out[i] = x; out[i + 1] = y; }
  return out;
}
function pathOf(lines, close) {
  const p = new Path2D();
  for (const line of lines) {
    const q = decode(line);
    p.moveTo(q[0], q[1]);
    for (let i = 2; i < q.length; i += 2) p.lineTo(q[i], q[i + 1]);
    if (close) p.closePath();
  }
  return p;
}
function polygonPath(polys) {
  const p = new Path2D();
  for (const poly of polys) {
    for (const ring of [poly.o, ...poly.i]) {
      const q = decode(ring);
      p.moveTo(q[0], q[1]);
      for (let i = 2; i < q.length; i += 2) p.lineTo(q[i], q[i + 1]);
      p.closePath();
    }
  }
  return p;
}
// 一座城一份 scene：解码后的图层 + 每条散步的公里数。渲染器只认 scene，不认全局。
function makeScene(city) {
  const layers = {
    roads: [1, 2, 3, 4].map(t => pathOf(city.roads[String(t)])),
    rail: pathOf(city.rail),
    water: polygonPath(city.water),
    waterLines: city.waterLines.map(l => ({ w: l.w, p: pathOf([l.p]) })),
    green: polygonPath(city.green),
    tracks: { free: city.walks.map(decode), snapped: city.snapped.map(decode) },
  };
  const kmOf = q => { let d = 0; for (let i = 2; i < q.length; i += 2) d += Math.hypot(q[i] - q[i - 2], q[i + 1] - q[i - 1]); return d / 1000; };
  const km = { free: layers.tracks.free.map(kmOf), snapped: layers.tracks.snapped.map(kmOf) };
  return { city, layers, km, frame: city.frame };
}

// ---------- 渲染：屏幕与打印走同一个函数，只差像素尺寸 ----------
const BAND = 0.11;   // 底部标题带占海报高度
function render(canvas, W, H, style, opts, scene) {
  const [FW, FH] = scene.frame, LAYERS = scene.layers;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const mapH = opts.band === false ? H : H * (1 - BAND);
  const s = W / FW;                                   // 每米像素
  const mPx = m => m / s;                             // 像素 → 米
  ctx.fillStyle = style.paper; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, mapH); ctx.clip();
  ctx.setTransform(s, 0, 0, -s, W / 2, mapH / 2);   // 之后全部以米作画，y 朝北
  ctx.fillStyle = style.block; ctx.fillRect(-FW / 2, -FH / 2, FW, FH);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  if (opts.green) { ctx.fillStyle = style.green; ctx.fill(LAYERS.green, 'evenodd'); }
  ctx.fillStyle = style.water; ctx.fill(LAYERS.water, 'evenodd');
  if (style.hatch) {                                  // 水面排线：只在裁到水面之内画
    ctx.save(); ctx.clip(LAYERS.water, 'evenodd');
    ctx.strokeStyle = style.hatch; ctx.lineWidth = Math.max(1.2, mPx(.9)); ctx.beginPath();
    const step = Math.max(36, mPx(7));
    for (let d = -FW - FH; d < FW + FH; d += step) { ctx.moveTo(d - FH, -FH); ctx.lineTo(d + FH, FH); }
    ctx.stroke(); ctx.restore();
  }
  ctx.strokeStyle = style.waterLine;
  for (const l of LAYERS.waterLines) { ctx.lineWidth = l.w; ctx.stroke(l.p); }
  if (opts.rail) {
    ctx.strokeStyle = style.rail; ctx.lineWidth = Math.max(2.2, mPx(.8));
    ctx.setLineDash([mPx(6), mPx(6)]); ctx.stroke(LAYERS.rail); ctx.setLineDash([]);
  }
  ctx.strokeStyle = style.road;
  for (let t = 3; t >= 0; t--) {                      // 细路先画，宽路盖上去，路口自然融合
    if (t === 3 && !opts.paths) continue;
    // roadFade：主干实、末梢淡，底图自己有层次，不必靠加深整层去换可读性
    ctx.globalAlpha = style.roadFade ? style.roadFade[t] : 1;
    // roadTiers：主干与末梢不同色。街区的织理由密集的支路自己画出来，我们没有建筑轮廓
    ctx.strokeStyle = style.roadTiers ? style.roadTiers[t] : style.road;
    ctx.lineWidth = Math.max(style.roadW[t], mPx(style.minPx[t]));
    ctx.stroke(LAYERS.roads[t]);
  }
  ctx.globalAlpha = 1;

  // 测绘十字：每公里一枚，图版样式用它交代比例，比画一根比例尺更安静
  if (style.crosses) {
    ctx.strokeStyle = style.crosses;
    ctx.lineWidth = Math.max(1.1, mPx(.55));
    const step = 1000, arm = Math.max(55, mPx(4));
    ctx.beginPath();
    for (let x = -Math.floor(FW / 2 / step) * step; x <= FW / 2; x += step)
      for (let y = -Math.floor(FH / 2 / step) * step; y <= FH / 2; y += step) {
        ctx.moveTo(x - arm, y); ctx.lineTo(x + arm, y);
        ctx.moveTo(x, y - arm); ctx.lineTo(x, y + arm);
      }
    ctx.stroke();
  }
  ctx.restore();

  if (style.crosses) {                                // 图廓
    ctx.strokeStyle = style.crosses; ctx.lineWidth = 1;
    const m = Math.round(W * .022) + .5;
    ctx.strokeRect(m, m, W - 2 * m, mapH - 2 * m);
  }

  drawInk(ctx, W, mapH, s, style, opts, scene);
  if (opts.band !== false) drawBand(ctx, W, H, mapH, style, opts, scene);
}

// 轨迹墨迹：一笔细线，低透明度叠加。重复走的路靠透明度累积自己变深，
// 再用一条连续曲线把累积量映成墨色深浅，没有分档的色阶边，也不画晕。
// 线宽与底图的支路同量级（约 5 米），屏幕上保底 1.3 像素。密度缓冲最长边不超过 2400px，打印尺寸也画得动。
function drawInk(ctx, W, mapH, s, style, opts, scene) {
  const k = Math.min(1, 2400 / Math.max(W, mapH));
  const w = Math.round(W * k), h = Math.round(mapH * k);
  const off = document.createElement('canvas'); off.width = w; off.height = h;
  const o = off.getContext('2d');
  o.setTransform(s * k, 0, 0, -s * k, w / 2, h / 2);
  o.lineJoin = 'round'; o.lineCap = 'round';
  o.lineWidth = Math.max(6, 1.5 / (s * k)); o.strokeStyle = 'rgba(0,0,0,0.15)';
  for (let i = 0; i < opts.count; i++) {
    const q = scene.layers.tracks[opts.track][i];
    o.beginPath(); o.moveTo(q[0], q[1]);
    for (let j = 2; j < q.length; j += 2) o.lineTo(q[j], q[j + 1]);
    o.stroke();
  }
  const img = o.getImageData(0, 0, w, h), d = img.data;
  const [r, g, b] = hex(style.ink), [lo, hi] = style.inkRange;
  for (let i = 3; i < d.length; i += 4) {
    const a = d[i] / 255;
    const t = a < 0.03 ? 0 : Math.min(1, Math.pow((a - 0.03) / 0.45, 0.7));
    d[i - 3] = r; d[i - 2] = g; d[i - 1] = b; d[i] = t === 0 ? 0 : (lo + (hi - lo) * t) * 255;
  }
  o.setTransform(1, 0, 0, 1, 0, 0); o.putImageData(img, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, mapH); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, w, h, 0, 0, W, mapH);
  ctx.restore();
}

function drawBand(ctx, W, H, mapH, style, opts, scene) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const pad = W * .06, base = mapH + (H - mapH) * .62;
  const km = Math.round(scene.km[opts.track].slice(0, opts.count).reduce((a, b) => a + b, 0));
  ctx.fillStyle = style.text; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 ${W * .07}px "Noto Serif SC", "Songti SC", serif`;
  ctx.fillText(scene.city.name, pad, base);
  ctx.font = `500 ${W * .022}px "Noto Serif SC", "Songti SC", serif`;
  ctx.fillStyle = style.mute;
  ctx.fillText(`${scene.city.since}起 · ${km} km`, pad + W * .07 * 2.15 + W * .02, base);
  ctx.font = `${W * .013}px -apple-system, "PingFang SC", sans-serif`;
  ctx.textAlign = 'right'; ctx.fillText('© OpenStreetMap contributors', W - pad, base);
  ctx.textAlign = 'left';
}
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
window.CityMap = {
  CITIES: {},
  SCENES: {},
  STYLES, styleById: Object.fromEntries(STYLES.map(s => [s.id, s])),
  render, makeScene
};
window.__cityMapReady = true;
window.dispatchEvent(new Event('citymap-ready'));

})();
</script>
